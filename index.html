<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 13.50 &middot; GoldHEN</title>
<style>
:root{--fg:#eaf1fb;--dim:#8a9ab2;--line:rgba(130,170,220,.16);
      --c1:#5aa8ff;--c2:#7ee0c0;--ok:#57e3a0;--bad:#ff7a6b;--warn:#ffc76b}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#04060a;color:var(--fg);overflow:hidden;
  font:16px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;
  display:flex;align-items:center;justify-content:center}
/* animated backdrop */
body:before{content:"";position:fixed;inset:-40%;z-index:0;
  background:
    radial-gradient(40% 38% at 50% 6%,rgba(59,140,255,.32),transparent 70%),
    radial-gradient(32% 28% at 12% 88%,rgba(130,80,255,.22),transparent 70%),
    radial-gradient(30% 26% at 88% 92%,rgba(0,230,180,.16),transparent 70%);
  animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1);opacity:.85}
                 to{transform:translate3d(2%,2%,0) scale(1.07);opacity:1}}
body:after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.4;
  background-image:linear-gradient(rgba(130,170,220,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(130,170,220,.045) 1px,transparent 1px);
  background-size:52px 52px;
  -webkit-mask-image:radial-gradient(70% 60% at 50% 50%,#000 30%,transparent 100%)}
.card{position:relative;z-index:1;width:min(690px,88vw);padding:28px 36px 16px;
  background:linear-gradient(180deg,rgba(18,24,34,.86),rgba(10,14,20,.92));
  border:1px solid var(--line);border-radius:26px;
  box-shadow:0 34px 90px rgba(0,0,0,.7),0 0 0 1px rgba(90,168,255,.08) inset,
             0 1px 0 rgba(255,255,255,.06) inset;backdrop-filter:blur(18px);text-align:center}
.card:before{content:"";position:absolute;inset:-1px;border-radius:26px;padding:1px;
  background:linear-gradient(140deg,rgba(90,168,255,.55),transparent 40%,
             transparent 60%,rgba(126,224,192,.45));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;pointer-events:none}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.mark{display:flex;align-items:center;gap:11px}
.orb{width:30px;height:30px;border-radius:9px;position:relative;
  background:linear-gradient(145deg,#5aa8ff,#1b3fd6);
  box-shadow:0 0 22px rgba(59,140,255,.75),inset 0 1px 0 rgba(255,255,255,.5)}
.orb:after{content:"";position:absolute;inset:-6px;border-radius:14px;
  border:1px solid rgba(90,168,255,.35);animation:halo 2.6s ease-in-out infinite alternate}
@keyframes halo{from{opacity:.25;transform:scale(.96)}to{opacity:.8;transform:scale(1.06)}}
.mark b{font-size:12.5px;letter-spacing:.28em;color:#d6e4f8;font-weight:700}
.chip{font-size:11px;letter-spacing:.16em;padding:5px 13px;border-radius:999px;
  border:1px solid rgba(87,227,160,.4);color:var(--ok);background:rgba(87,227,160,.09)}
.chip.bad{border-color:rgba(255,122,107,.4);color:var(--bad);background:rgba(255,122,107,.09)}
.hero{font-size:clamp(44px,9vw,74px);font-weight:800;letter-spacing:-.035em;line-height:.95;
  margin:4px 0 2px;
  background:linear-gradient(135deg,#fff 10%,#8fd0ff 55%,#7ee0c0 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 6px 26px rgba(90,168,255,.35))}
.hero small{display:block;font-size:.24em;letter-spacing:.42em;font-weight:600;
  -webkit-text-fill-color:#93a7c2;margin-top:10px}
.ring{position:relative;width:190px;height:190px;margin:10px auto 6px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.track{stroke:rgba(130,170,220,.12)}
.bar{stroke:url(#grad);transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1);
  filter:drop-shadow(0 0 10px rgba(90,168,255,.8))}
.core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.num{font-size:39px;font-weight:800;letter-spacing:-.02em;line-height:1}
.num i{font-size:16px;font-style:normal;color:#8fb6e0}
.cap{font-size:10px;letter-spacing:.3em;color:var(--dim);margin-top:3px}
.status{font-size:19px;font-weight:700;margin:6px 0 4px}
.sub{font-size:12.5px;color:var(--dim);min-height:18px}
.sub b{color:#c3d6ee;font-weight:600}
.actions{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:16px;flex-wrap:wrap}
.go{padding:15px 44px;border:0;cursor:pointer;border-radius:999px;
  font:700 16px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.2em;color:#04121e;
  background:linear-gradient(135deg,#7ee0c0,#5aa8ff);
  box-shadow:0 12px 34px rgba(59,140,255,.5),inset 0 1px 0 rgba(255,255,255,.55);
  animation:glow 2.2s ease-in-out infinite alternate;position:relative;overflow:hidden}
.go:active{transform:scale(.975)}
.go:focus{outline:3px solid rgba(126,224,192,.55);outline-offset:4px}
@keyframes glow{from{box-shadow:0 10px 26px rgba(59,140,255,.35)}
                to{box-shadow:0 12px 46px rgba(59,140,255,.85)}}
.ghost{padding:13px 26px;border-radius:999px;cursor:pointer;text-decoration:none;
  font:600 12px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.18em;
  color:#b8cde6;border:1px solid rgba(130,170,220,.3);background:rgba(255,255,255,.03)}
.ghost:hover{border-color:rgba(126,224,192,.55);color:#dff6ee}
.hint{margin-top:10px;font-size:11px;color:#5d6d84;letter-spacing:.09em}
body.running .go,body.running .hint{display:none}
.foot{margin-top:18px;padding-top:13px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;font-size:10.5px;color:#5d6d84;letter-spacing:.1em}
.credit{margin-top:9px;text-align:center;font-size:10px;letter-spacing:.26em;
  color:#414e63;text-transform:uppercase}
.credit span{color:#6f8fb8}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="mark"><div class="orb"></div><b>GOLDHEN</b></div>
    <div class="chip" id="chip">FW DETECTING</div>
  </div>

  <div class="hero">13.50<small>JAILBREAK STATION</small></div>

  <div class="ring">
    <svg viewBox="0 0 190 190">
      <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5aa8ff"/>
        <stop offset=".55" stop-color="#6cc0f5"/>
        <stop offset="1" stop-color="#7ee0c0"/>
      </linearGradient></defs>
      <circle class="track" cx="95" cy="95" r="85"/>
      <circle class="bar" id="bar" cx="95" cy="95" r="85"
              stroke-dasharray="534.07" stroke-dashoffset="534.07"/>
    </svg>
    <div class="core">
      <div class="num" id="num">0<i>%</i></div>
      <div class="cap" id="phase">IDLE</div>
    </div>
  </div>

  <div class="status" id="status">Waiting for you&hellip;</div>
  <div class="sub" id="sub"></div>

  <div class="actions">
    <button class="go" id="go" autofocus>START JAILBREAK</button>
    <a class="ghost" href="payloads.html">PAYLOADS</a>
  </div>
  <div class="hint">press START or ENTER &middot; console must be on 13.50</div>

  <div class="foot">
    <span>PS4 &middot; 13.02 &ndash; 13.52 CHAIN</span>
    <span id="cache">CACHE: CHECKING</span>
  </div>
  <div class="credit">coded by <span>fico</span></div>
</div>

<script>
(function () {
  var CIRC = 2 * Math.PI * 85;
  var bar=document.getElementById("bar"), num=document.getElementById("num"),
      phase=document.getElementById("phase"), status=document.getElementById("status"),
      sub=document.getElementById("sub"), chip=document.getElementById("chip"),
      cache=document.getElementById("cache"), goBtn=document.getElementById("go");
  var pct=0, started=false;

  function setProgress(v,t){pct=Math.max(pct,Math.min(100,v));
    bar.setAttribute("stroke-dashoffset",CIRC*(1-pct/100));
    num.innerHTML=Math.round(pct)+'<i>%</i>'; if(t)phase.textContent=t.toUpperCase();}
  function setStatus(t,c){status.textContent=t;status.className="status "+(c||"");}

  var m=/PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
  var key=null,fwnum=null;
  if(m){var ms=parseInt(m[2],16).toString(16); if(ms.length<2)ms="0"+ms;
    key=m[1]+"."+ms; fwnum=parseInt(m[1],10)*100+parseInt(ms,10);}
  var SUPPORTED={1302:1,1304:1,1350:1,1352:1};
  var params=new URLSearchParams(location.search);
  var forced=params.get("force")==="1";
  var supported=forced||(fwnum!==null&&SUPPORTED[fwnum]===1);

  chip.textContent="FW "+(key||"UNKNOWN");
  chip.className="chip"+(supported?"":" bad");
  sub.innerHTML="kernel table <b>"+(supported?"matched":"not listed")+
                "</b> &middot; bug 663 webkit &middot; aio kernel race";
  setProgress(8,"ready");
  setStatus(supported?"Ready to arm the chain.":"Firmware not listed \u2014 you can still try.","warn");

  function targetUrl(){var q="start=1"; if(forced)q+="&force=1";
    if(params.get("log")==="1")q+="&log=1"; return "jb.html?"+q;}
  function go(){setProgress(100,"launch");
    setStatus("Handing over to the exploit chain\u2026","warn");
    setTimeout(function(){location.replace(targetUrl());},350);}

  function waitCached(){
    setStatus("Caching exploit for offline use\u2026","warn");
    setProgress(12,"cache");
    var ac=window.applicationCache, done=false;
    function finish(msg,cls){if(done)return; done=true; setStatus(msg,cls); go();}
    setTimeout(function(){finish("Cache slow/unavailable \u2014 running online.","warn");},15000);
    ac.addEventListener("progress",function(e){
      if(e&&e.total){var p=Math.round(e.loaded/e.total*100);
        cache.textContent="CACHE: "+p+"%"; setProgress(12+p*0.78,"cache "+p+"%");}
      else{cache.textContent="CACHE: DOWNLOADING";}},false);
    ac.addEventListener("cached",function(){cache.textContent="CACHE: OFFLINE-READY";
      setProgress(92,"cached"); finish("Cached. Starting\u2026","ok");},false);
    ac.addEventListener("noupdate",function(){cache.textContent="CACHE: READY";
      setProgress(92,"cached"); finish("Ready.","ok");},false);
    ac.addEventListener("updateready",function(){try{ac.swapCache();}catch(e){}
      finish("Updated. Reloading\u2026","warn");
      setTimeout(function(){location.reload();},800);},false);
    ac.addEventListener("error",function(){finish("Cache failed \u2014 running online.","warn");},false);
    ac.addEventListener("obsolete",function(){finish("Cache obsolete \u2014 running online.","warn");},false);
    try{ac.update();}catch(e){finish("Running online.","warn");}
  }

  function start(){
    if(started)return; started=true; document.body.classList.add("running");
    var ac=window.applicationCache;
    if(!ac||!document.documentElement.hasAttribute("manifest")){go();return;}
    if(!navigator.onLine){cache.textContent="CACHE: OFFLINE-READY";
      setProgress(92,"cached"); go(); return;}
    if(ac.status===ac.IDLE){cache.textContent="CACHE: READY";
      setProgress(92,"cached"); go(); return;}
    waitCached();
  }

  goBtn.addEventListener("click",start,false);
  document.addEventListener("keydown",function(e){
    if((e.key==="Enter"||e.keyCode===13)&&!started){e.preventDefault();start();}},false);
  try{goBtn.focus();}catch(e){}
})();
</script>
</body>
</html>
