<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 13.50 &middot; GoldHEN</title>
<style>
:root{--fg:#e3ebf7;--dim:#8494aa;--line:rgba(125,160,205,.14);
      --accent:#3b8cff;--ok:#57e3a0;--bad:#ff7a6b;--warn:#ffc76b}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#06080c;color:var(--fg);overflow:hidden;
     font:16px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
body:before{content:"";position:fixed;inset:-30%;
  background:radial-gradient(45% 40% at 50% 10%,rgba(59,140,255,.22),transparent 70%),
             radial-gradient(40% 35% at 85% 95%,rgba(0,220,180,.1),transparent 70%);
  animation:breathe 8s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.8}to{opacity:1;transform:scale(1.06)}}
.shell{width:min(720px,90vw);padding:24px 30px 18px;
  background:rgba(14,19,27,.74);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 30px 70px rgba(0,0,0,.55);backdrop-filter:blur(14px);
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.mark{display:flex;align-items:center;gap:10px}
.orb{width:26px;height:26px;border-radius:8px;background:linear-gradient(145deg,#4f9dff,#1b56d6);
     box-shadow:0 0 16px rgba(59,140,255,.6),inset 0 1px 0 rgba(255,255,255,.4)}
.mark b{font-size:12px;letter-spacing:.24em;color:#cfe0f6}
.timer{font-size:12px;color:var(--dim);letter-spacing:.1em}
.row{display:flex;gap:22px;align-items:center}
.ring{position:relative;width:176px;height:176px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.track{stroke:rgba(125,160,205,.13)}
.bar{stroke:url(#g2);transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1);
     filter:drop-shadow(0 0 10px rgba(59,140,255,.7))}
.spin{stroke:rgba(87,227,160,.28);stroke-dasharray:22 600;stroke-width:8;
      animation:rot 1.1s linear infinite;transform-origin:88px 88px;opacity:0}
body.running .spin{opacity:1}
@keyframes rot{to{transform:rotate(360deg)}}
.core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.num{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1}
.cap{font-size:10px;letter-spacing:.24em;color:var(--dim);margin-top:4px}
.stage{font-size:13px;color:#b9cbe3;min-height:19px}
.list{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.step{display:flex;align-items:center;gap:9px;color:#5f6d82;transition:color .3s}
.step .dot{width:9px;height:9px;border-radius:50%;background:#25303f;flex:0 0 auto;
           transition:background .3s,box-shadow .3s}
.step.live{color:#dbe7f6}
.step.live .dot{background:var(--accent);box-shadow:0 0 10px rgba(59,140,255,.9);
                animation:pulse 1s ease-in-out infinite alternate}
.step.done{color:var(--ok)}
.step.done .dot{background:var(--ok);box-shadow:0 0 8px rgba(87,227,160,.6)}
@keyframes pulse{from{opacity:.5}to{opacity:1}}
.go{
  margin:18px auto 2px; display:block; padding:15px 46px; border:0; cursor:pointer;
  border-radius:999px; font:700 17px/1 "Segoe UI",system-ui,sans-serif;
  letter-spacing:.18em; color:#06121f;
  background:linear-gradient(135deg,#7ee0c0,#4f9dff);
  box-shadow:0 10px 30px rgba(59,140,255,.45), inset 0 1px 0 rgba(255,255,255,.5);
  animation:glow 2.1s ease-in-out infinite alternate;
}
.go:active{transform:scale(.97)}
.go:focus{outline:3px solid rgba(126,224,192,.6); outline-offset:4px}
@keyframes glow{from{box-shadow:0 10px 26px rgba(59,140,255,.35)}
                to{box-shadow:0 10px 40px rgba(59,140,255,.75)}}
.hint{margin-top:9px;text-align:center;font-size:11.5px;color:#63728a;letter-spacing:.08em}
body.running .go,body.running .hint{display:none}
.log{margin-top:16px;border-top:1px solid var(--line);padding-top:10px;
     font:11.5px/1.5 ui-monospace,Consolas,monospace;color:#5c6a7e;
     height:60px;overflow:hidden;white-space:pre-wrap}
.log b{color:#9fb4cd;font-weight:600}
.credit{margin-top:12px;text-align:center;font-size:10.5px;letter-spacing:.22em;
        color:#47546a;text-transform:uppercase}
.credit span{color:#6f8fb8}
body.done .bar{stroke:#57e3a0;filter:drop-shadow(0 0 12px rgba(87,227,160,.8))}
body.done .num,body.done .cap{color:var(--ok)}
body.fail .bar{stroke:#ff7a6b;filter:drop-shadow(0 0 12px rgba(255,122,107,.7))}
body.fail .num,body.fail .cap{color:var(--bad)}
#msg{display:none;margin-top:12px;font-size:14px;text-align:center}
body.done #msg{display:block;color:var(--ok)}
body.fail #msg{display:block;color:var(--bad)}
body.log #out{display:block}
#out{display:none;position:fixed;inset:0;margin:0;padding:16px;overflow:auto;
     background:rgba(6,8,12,.96);font:11.5px/1.5 ui-monospace,Consolas,monospace;
     color:#9fb4cd;white-space:pre-wrap}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="mark"><div class="orb"></div><b>GOLDHEN</b></div>
    <div class="timer" id="timer">00:00</div>
  </div>

  <div class="row">
    <div class="ring">
      <svg viewBox="0 0 176 176">
        <defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5aa8ff"/>
          <stop offset=".6" stop-color="#3b8cff"/>
          <stop offset="1" stop-color="#7ee0c0"/>
        </linearGradient></defs>
        <circle class="track" cx="88" cy="88" r="76"/>
        <circle class="bar" id="bar" cx="88" cy="88" r="76"
                stroke-dasharray="477.5" stroke-dashoffset="477.5"/>
        <circle class="spin" cx="88" cy="88" r="76"/>
      </svg>
      <div class="core">
        <div class="num" id="num">0<span style="font-size:16px">%</span></div>
        <div class="cap" id="cap">READY</div>
      </div>
    </div>

    <div class="list" id="list"></div>
  </div>

  <button class="go" id="go" autofocus>START JAILBREAK</button>
  <div class="hint">press the button or ENTER to arm the chain</div>

  <div class="stage" id="stage"><em>idle &mdash; nothing running yet</em></div>
  <div class="log" id="log"></div>
  <div id="msg"></div>
  <div class="credit">coded by <span>fico</span></div>
</div>

<div id="wrap" style="position:fixed;left:-9999px"><div id="state"></div><div id="out"></div></div>

<script type="module">
  var CIRC = 2 * Math.PI * 76;
  var bar   = document.getElementById("bar");
  var num   = document.getElementById("num");
  var cap   = document.getElementById("cap");
  var stage = document.getElementById("stage");
  var logEl = document.getElementById("log");
  var msg   = document.getElementById("msg");
  var timer = document.getElementById("timer");
  var goBtn = document.getElementById("go");
  var params = new URLSearchParams(location.search);

  var STEPS = [
    { label: "Firmware / WebKit offsets", pct: 12 },
    { label: "Heap grooming & fake cell",  pct: 28 },
    { label: "Arbitrary read primitive",   pct: 40 },
    { label: "Arbitrary read/write pair",  pct: 52 },
    { label: "Kernel exploit (aio race)",  pct: 70 },
    { label: "Kernel patch applied",       pct: 84 },
    { label: "GoldHEN payload injected",   pct: 96 }
  ];
  var listEl = document.getElementById("list");
  STEPS.forEach(function (s, i) {
    var d = document.createElement("div");
    d.className = "step"; d.id = "s" + i;
    d.innerHTML = '<span class="dot"></span><span>' + s.label + "</span>";
    listEl.appendChild(d);
  });

  var pct = 0, started = false, t0 = 0;
  setInterval(function () {
    if (!started) return;
    var s = Math.floor((Date.now() - t0) / 1000);
    timer.textContent = ("0" + Math.floor(s / 60)).slice(-2) + ":" + ("0" + (s % 60)).slice(-2);
  }, 500);

  function draw(v, capText) {
    pct = Math.max(pct, Math.min(100, v));
    bar.setAttribute("stroke-dashoffset", CIRC * (1 - pct / 100));
    num.innerHTML = Math.round(pct) + '<span style="font-size:16px">%</span>';
    if (capText) cap.textContent = capText.toUpperCase();

    var target = 0;
    STEPS.forEach(function (s, i) { if (pct >= s.pct) target = i; });
    for (var i = 0; i < STEPS.length; i++) {
      var el = document.getElementById("s" + i);
      el.className = "step" + (i < target ? " done" : i === target ? " live" : "");
    }
  }

  function note(line) {
    var b = document.createElement("b");
    b.textContent = line + "\n";
    logEl.appendChild(b);
    while (logEl.childNodes.length > 5) logEl.removeChild(logEl.firstChild);
  }

  var MAP = [
    { re: /READ-PRIMITIVE|SSV-|RW-CARRIER|HOLDER|JSC-PROFILE/i, v: 40, c: "read primitive" },
    { re: /PAIR-UP|PAIR-REPROVED|PAIR-RELEASE/i,                v: 52, c: "r/w pair" },
    { re: /KF-|KERN|unhide|armings|PR-GATE|PR-DRAIN/i,          v: 70, c: "kernel race" },
    { re: /CAPS-COLLATERAL|system_caps|ucred|prison0/i,         v: 84, c: "kpatch" },
    { re: /PAYLOAD|goldhen|kp_exec|load/i,                      v: 96, c: "payload" },
    { re: /PROOF-SUMMARY-FINAL/i,                               v: 99, c: "finishing" }
  ];

  var outEl   = document.getElementById("out");
  var stateEl = document.getElementById("state");
  var seen = 0, tagged = 0;

  function scan() {
    if (!started) return;
    var txt = outEl.textContent || "";
    var lines = txt.split("\n");
    if (lines.length > seen) {
      for (var i = seen; i < lines.length; i++) {
        var L = lines[i].trim();
        if (!L) continue;
        var hit = null;
        for (var k = 0; k < MAP.length; k++) if (MAP[k].re.test(L)) { hit = MAP[k]; break; }
        if (hit) { draw(hit.v, hit.c); note(L.slice(0, 88)); }
        else if (++tagged % 3 === 0) { draw(pct + 2); note(L.slice(0, 88)); }
      }
      seen = lines.length;
    }
    if (stateEl.textContent) stage.innerHTML = stateEl.textContent;

    if (document.body.classList.contains("done")) {
      draw(100, "goldhen");
      msg.textContent = "Success \u2014 GoldHEN loaded. Browser will close.";
    } else if (document.body.classList.contains("fail")) {
      cap.textContent = "FAILED";
      msg.textContent = "Attempt missed \u2014 reboot the console and reload.";
    }
  }

  function start() {
    if (started) return;
    started = true;
    t0 = Date.now();
    document.body.classList.add("running");
    stage.innerHTML = "<em>initialising engine&hellip;</em>";
    draw(6, "arming");
    note("coded by fico -- arming chain");

    import("./jb.js?v=19").catch(function (e) {
      document.body.classList.add("fail");
      cap.textContent = "LOAD FAILED";
      msg.textContent = "Could not load exploit engine: " + ((e && e.message) || e);
    });
  }

  goBtn.addEventListener("click", start, false);
  document.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.keyCode === 13) && !started) { e.preventDefault(); start(); }
  }, false);

  var mo = new MutationObserver(scan);
  mo.observe(document.getElementById("wrap"), { childList: true, subtree: true, characterData: true });
  setInterval(scan, 400);
  draw(0, "ready");
  try { goBtn.focus(); } catch (e) {}

  // arriving from index.html with ?start=1 -> run immediately (button already pressed)
  if (params.get("start") === "1") setTimeout(start, 400);
</script>
</body>
</html>
